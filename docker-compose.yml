services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://appuser:apppass@db:5432/appdb
      CLOUD_PROVIDER: local
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
